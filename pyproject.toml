[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animation-resource-pipeline"
version = "0.1.0"
description = "Skeleton animation retargeting pipeline with separated resources, mappings and batches"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
anim-pipeline = "anim_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
